<!DOCTYPE html>
<html lang="nl"><head>
<meta charset="utf-8">
<title>Link Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,system-ui,sans-serif}
body{background:#0f0f10;color:#f0f0f0;padding:18px;line-height:1.5;font-size:14px}
h1{font-size:18px;margin-bottom:14px}
.box{background:#181819;border:1px solid #333;border-radius:12px;padding:14px;margin-bottom:12px;word-break:break-all}
.label{color:#888;font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.val{font-size:13px}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700;margin:2px 4px 2px 0}
.yes{background:#1d3a24;color:#5cca7e}
.no{background:#3a1d1d;color:#ca5c5c}
button,a.btn{display:block;width:100%;text-align:center;background:#2a2030;color:#fff;border:1px solid #444;border-radius:10px;padding:14px;font-size:15px;font-weight:600;margin-bottom:10px;text-decoration:none;cursor:pointer}
#log{background:#000;border-radius:10px;padding:12px;font-family:monospace;font-size:12px;min-height:60px;white-space:pre-wrap;word-break:break-all}
.log-line{padding:3px 0;border-bottom:1px solid #1a1a1a}
</style>
</head><body>

<h1>🔍 Link Diagnose</h1>

<div class="box">
  <div class="label">Wat ben ik volgens de browser? (User-Agent)</div>
  <div class="val" id="ua"></div>
</div>

<div class="box">
  <div class="label">Detectie</div>
  <div id="detect"></div>
</div>

<a class="btn" href="https://www.notmyleaks.com" onclick="testNormal(event)">
  TEST 1 — Gewone link (zoals nu)
</a>

<button onclick="testIntent()">
  TEST 2 — Android intent (forceer Chrome)
</button>

<button onclick="testNewTab()">
  TEST 3 — window.open nieuwe tab
</button>

<button onclick="testCopy()">
  TEST 4 — Link kopiëren naar klembord
</button>

<div class="box">
  <div class="label">Wat gebeurde er</div>
  <div id="log">Klik een knop hierboven…</div>
</div>

<script>
var UA = navigator.userAgent || '';
document.getElementById('ua').textContent = UA;

function tag(label, on){
  return '<span class="tag '+(on?'yes':'no')+'">'+label+': '+(on?'JA':'nee')+'</span>';
}
var isAndroid = /Android/i.test(UA);
var isIOS = /iPhone|iPad|iPod/i.test(UA);
var isTikTok = /TikTok|musical_ly|Bytedance/i.test(UA);
var isInApp = /TikTok|musical_ly|Bytedance|Instagram|FBAN|FBAV|FB_IAB|Snapchat|Line/i.test(UA);

document.getElementById('detect').innerHTML =
  tag('Android', isAndroid) +
  tag('iOS', isIOS) +
  tag('TikTok webview', isTikTok) +
  tag('In-app browser', isInApp);

var logEl = document.getElementById('log');
function log(msg){
  var t = new Date().toLocaleTimeString();
  logEl.innerHTML = '<div class="log-line">['+t+'] '+msg+'</div>' + logEl.innerHTML;
}

function testNormal(e){
  log('TEST 1: gewone href klik. Als je dit leest en de pagina is NIET veranderd, blokkeert TikTok de link.');
  // laat de normale klik gewoon gebeuren
}

function testIntent(){
  if(!isAndroid){ log('TEST 2: alleen voor Android. Jij bent geen Android.'); return; }
  var url = 'https://www.notmyleaks.com';
  var intentUrl = 'intent://www.notmyleaks.com#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(url)+';end';
  log('TEST 2: probeer Chrome-intent te openen…');
  try { window.location.href = intentUrl; }
  catch(err){ log('FOUT: '+err.message); }
}

function testNewTab(){
  log('TEST 3: window.open(...) aangeroepen.');
  var w = window.open('https://www.notmyleaks.com','_blank');
  if(!w){ log('TEST 3: window.open gaf NULL terug = geblokkeerd door de webview.'); }
  else { log('TEST 3: window.open lijkt gelukt.'); }
}

function testCopy(){
  var url='https://www.notmyleaks.com';
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){
      log('TEST 4: gekopieerd via clipboard API ✓');
    }).catch(function(e){
      log('TEST 4: clipboard API faalde ('+e.message+'), probeer fallback…');
      legacy(url);
    });
  } else { legacy(url); }
}
function legacy(url){
  try{
    var ta=document.createElement('textarea');ta.value=url;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    var ok=document.execCommand('copy');document.body.removeChild(ta);
    log('TEST 4: fallback kopie = '+(ok?'gelukt ✓':'mislukt ✗'));
  }catch(e){ log('TEST 4: fallback fout: '+e.message); }
}
</script>
</body></html>
